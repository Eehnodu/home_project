<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image.png" />

    <!-- 폰트: 한글 + 라틴 커버 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script
      type="text/javascript"
      src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"
    ></script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="google-site-verification"
      content="SSOrBFGM1wDHl7KnX65LrsxSM-2acoSjtc_4mhsY-uM"
    />
    <meta
      name="description"
      content="심플하지만 확실하게 동작하는 개발을 지향하는 웹 개발자 Nodu의 포트폴리오입니다."
    />
    <meta name="theme-color" content="#1c1917" />

    <!-- 링크 미리보기(카카오톡 · 슬랙 · X 등).
         og:image 가 없으면 카톡이 썸네일 없는 작은 카드로만 보여준다.
         절대 URL 이어야 한다 — 크롤러는 상대경로를 못 읽는다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nodu" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://noduu.duckdns.org/" />
    <meta property="og:title" content="Nodu — Web Developer" />
    <meta
      property="og:description"
      content="심플하지만 확실하게 동작하는 개발을 지향하는 웹 개발자 Nodu의 포트폴리오입니다."
    />
    <meta property="og:image" content="https://noduu.duckdns.org/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nodu — Web Developer 포트폴리오" />

    <!-- 이미지가 있으므로 큰 카드로. summary 는 작은 정사각 썸네일이다 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nodu — Web Developer" />
    <meta
      name="twitter:description"
      content="심플하지만 확실하게 동작하는 개발을 지향하는 웹 개발자 Nodu의 포트폴리오입니다."
    />
    <meta name="twitter:image" content="https://noduu.duckdns.org/og.png" />

    <title>Nodu — Web Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
